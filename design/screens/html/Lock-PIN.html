<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type your PIN</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 1280px; height: 800px">
  <header class="bar tall">
    <a class="mark solo" href="#" aria-label="Nimbus POS"><i></i></a>
    <h1 class="t-h">Tapas Downtown</h1>
    <span class="clock">Terminal 01 · Main hall</span>
    <span class="grow"></span>
    <span class="name">19:58 · Thu 26 Nov</span>
  </header>
  <main class="page" style="flex-direction: row; justify-content: center; align-items: center; gap: 64px">
    <section class="vstack g16" style="width: 440px; flex: none; justify-content: center">
      <div><p class="t-sup muted">Thursday 26 November</p><p class="big" style="font-size: 40px">19:58</p></div>
      <div class="card" style="padding: 16px 20px"><p class="cap" style="padding-bottom: 6px">Kept while locked</p><p class="t-body">Amina K. locked this screen at 19:58. Her table 23 has 3 items not sent; they wait for her.</p></div>
      <p class="t-sup muted">The screen locks itself after 15 minutes with no taps.</p>
    </section>
    <section class="card vstack g16" style="width: 420px; padding: 24px; flex: none">
      <h2 class="t-h" style="text-align: center">Type your PIN</h2>
      <div class="pin " aria-label="2 of 4 digits"><i class="on"></i><i class="on"></i><i></i><i></i></div>
      <p class="t-sup muted" style="text-align: center; min-height: 20px">Your PIN says who you are.</p>
      <div class="optgrid" style="grid-template-columns: repeat(3, minmax(0, 1fr))"><button class="key" style="height: 76px">1</button><button class="key" style="height: 76px">2</button><button class="key" style="height: 76px">3</button><button class="key" style="height: 76px">4</button><button class="key" style="height: 76px">5</button><button class="key" style="height: 76px">6</button><button class="key" style="height: 76px">7</button><button class="key" style="height: 76px">8</button><button class="key" style="height: 76px">9</button><button class="key" aria-label="Clear" style="height: 76px; font-size: 17px">Clear</button><button class="key" style="height: 76px">0</button><button class="key" style="height: 76px" aria-label="Delete"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 6H9l-6 6 6 6h12z"/><path d="m12 9 6 6M18 9l-6 6"/></svg></button></div>
      <button class="btn textbtn" style="align-self: center">Forgot your PIN?</button>
    </section>
  </main>
</div>
</x-dc>
</body>
</html>
