<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floor, phone, waiter</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 390px; height: 844px">
  <header class="band">
    <div class="hstack">
      <h1 class="t-title grow">Floor</h1>
      <button class="rb" aria-label="Find a table"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="rb" aria-label="New tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <p class="sub">6 tables are yours · as at 19:42</p>
  </header>

  <main class="body">
    <div class="seg fill" role="tablist" aria-label="Whose tables">
      <button class="on" role="tab" aria-selected="true">My tables · 6</button>
      <button role="tab" aria-selected="false">All tables</button>
    </div>

    <p class="cap">Yours</p>
    <div class="floor c" style="grid-template-columns: repeat(3, minmax(0, 1fr))">
      <button class="tbl"><span class="top"><span class="no">6</span><span class="t-bar muted">26 min</span></span><span class="bot"><span class="pill p-red">Late</span></span></button>
      <button class="tbl"><span class="top"><span class="no">23</span><span class="t-bar muted">3 items</span></span><span class="bot"><span class="pill p-amber">Not sent</span></span></button>
      <button class="tbl"><span class="top"><span class="no">12</span><span class="t-bar muted">1 h 05</span></span><span class="bot"><span class="pill p-amber">Bill</span></span></button>
      <button class="tbl"><span class="top"><span class="no">2</span><span class="t-bar muted">42 min</span></span><span class="bot"><span class="pill p-brand">Open</span></span></button>
      <button class="tbl"><span class="top"><span class="no">17</span><span class="t-bar muted">14 min</span></span><span class="bot"><span class="pill p-brand">Open</span></span></button>
      <button class="tbl"><span class="top"><span class="no">9</span><span class="t-bar muted">9 min</span></span><span class="bot"><span class="pill p-brand">Open</span></span></button>
    </div>

    <div class="sw">
      <button class="round sm" aria-label="Previous area"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
      <button class="mid"><span class="t-row">Main hall</span> <span class="t-sup muted">· 12 free</span></button>
      <button class="round sm" aria-label="Next area"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>

    <div class="floor c" style="grid-template-columns: repeat(3, minmax(0, 1fr))">
      <button class="tbl free"><span class="top"><span class="no">1</span><span class="t-bar muted">4 seats</span></span><span class="bot"><span class="pill p-green">Free</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">4</span><span class="t-bar muted">2 seats</span></span><span class="bot"><span class="pill p-green">Free</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">8</span><span class="t-bar muted">4 seats</span></span><span class="bot"><span class="pill p-green">Free</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">11</span><span class="t-bar muted">4 seats</span></span><span class="bot"><span class="pill p-green">Free</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">14</span><span class="t-bar muted">6 seats</span></span><span class="bot"><span class="pill p-green">Free</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">18</span><span class="t-bar muted">4 seats</span></span><span class="bot"><span class="pill p-green">Free</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">22</span><span class="t-bar muted">2 seats</span></span><span class="bot"><span class="pill p-green">Free</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">25</span><span class="t-bar muted">4 seats</span></span><span class="bot"><span class="pill p-green">Free</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">27</span><span class="t-bar muted">8 seats</span></span><span class="bot"><span class="pill p-green">Free</span></span></button>
    </div>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a class="on" aria-current="page" href="#"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Floor</a>
    <a href="#"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>Reservations</a>
    <a href="#"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M5 18a7 7 0 0 1 14 0M12 9V6M10 6h4"/></svg>Ready<span class="nb">2</span></a>
    <a href="#"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</a>
  </nav>
</div>
</x-dc>
</body>
</html>
