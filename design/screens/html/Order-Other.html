<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order screen, another waiter’s table</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 1280px; height: 800px">
  <header class="bar">
    <a class="back" href="Main.html"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>Floor</a>
    <h1 class="t-h">Table 3</h1>
    <span class="clock">Brian O.’s table · 2 guests · open 18 min</span>
    <span class="grow"></span>
    
    <span class="who" title="Signed in">AK</span>
  </header>
  <div class="ord" style="grid-template-columns: minmax(0, 1fr) 372px">
    <main class="menu" style="align-items: center; justify-content: center">
      <div class="card vstack" style="width: 520px; padding: 28px; gap: 16px; align-items: flex-start">
        <span class="bubble"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
        <div>
          <h2 class="t-h">This is Brian O.'s table</h2>
          <p class="t-body muted" style="margin-top: 6px">You can see the order and print the bill. To add or change items, the table has to be yours.</p>
        </div>
        <div class="optgrid" style="grid-template-columns: 1fr 1fr; width: 100%">
          <button class="act "><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5 5"/></svg><span class="grow"><b>Ask Brian O.</b><small>Sends him a request</small></span></button><button class="act "><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span class="grow"><b>Take it over</b><small>Needs a supervisor PIN</small></span></button>
        </div>
      </div>
    </main>
    <aside class="check" aria-label="Order">
      <div class="hstack" style="padding: 16px 16px 8px; justify-content: space-between"><h2 class="t-h">Order</h2><span class="t-sup muted">4 items</span></div>
      <p class="cap" style="padding: 8px 16px 4px">Sent 20:02</p><button class="line sent"><span class="q">2</span><span class="grow"><span class="nm">Lager 500 ml</span></span><span class="pr">12,000</span></button><button class="line sent"><span class="q">1</span><span class="grow"><span class="nm">Margherita pizza</span></span><span class="pr">30,000</span></button><button class="line sent"><span class="q">1</span><span class="grow"><span class="nm">Greek salad</span><br><span class="sub">No olives</span></span><span class="pr">20,000</span></button>
      <span class="grow"></span>
      <div class="hr"></div>
      <div class="tot" style="padding: 14px 16px 4px"><span class="t-row">Total</span><span class="t-h">UGX 62,000</span></div>
      <div class="hstack g8" style="padding: 12px 16px 16px"><button class="btn filled" style="flex: 1 1 0; padding: 0 12px">Print bill</button></div>
    </aside>
  </div>
</div>
</x-dc>
</body>
</html>
