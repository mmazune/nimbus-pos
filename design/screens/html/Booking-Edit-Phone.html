<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit a booking, phone</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 390px; height: 844px">
  <header class="band" style="padding-bottom: 16px">
    <div class="hstack">
      <a class="rb" href="#" aria-label="Back"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
      <div class="grow"><h1 class="t-h">S. Okello</h1><p class="t-sup" style="color: var(--on-primary-muted)">Change details</p></div>
      
    </div>
  </header><main class="body" style="gap: 14px"><div><p class="lab">Time</p><div class="optgrid" style="grid-template-columns: repeat(3, minmax(0, 1fr))"><button class="opt">20:00</button><button class="opt">20:30</button><button class="opt on">21:00</button></div></div><div class="hstack"><p class="lab grow" style="margin: 0">Guests</p><div class="step"><button class="round sm tonal" aria-label="One fewer"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><b>5</b><button class="round sm tonal" aria-label="One more"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></div><div><p class="lab">Table</p><div class="field">Table 14 · 6 seats</div></div><p class="t-sup" style="color: var(--amber)">Table 21 has 4 seats, so 5 guests moved to table 14.</p><div><label class="lab">Phone</label><div class="field">+256 700 000 131</div></div></main>
  <footer class="foot"><button class="btn tonal" style="flex: 1 1 0">Undo</button><button class="btn filled" style="flex: 2 1 0">Save changes</button></footer>
</div>
</x-dc>
</body>
</html>
