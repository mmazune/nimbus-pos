<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order screen, phone, the menu</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 390px; height: 844px">
  <header class="band" style="padding-bottom: 16px">
    <div class="hstack">
      <a class="rb" href="Floor-Phone.html" aria-label="Back to the floor"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
      <div class="grow">
        <h1 class="t-h">Table 12</h1>
        <p class="t-sup" style="color: var(--on-primary-muted)">3 guests · open 1 h 05</p>
      </div>
      <button class="rb" aria-label="Table actions"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </div>
  </header>

  <main class="body" style="gap: 12px">
    <div class="field ph"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search the whole menu</div>

    <div class="seg fill" role="tablist" aria-label="Menu">
      <button role="tab" aria-selected="false">Food</button>
      <button class="on" role="tab" aria-selected="true">Drinks</button>
    </div>

    <div class="optgrid" role="tablist" aria-label="Drinks groups" style="grid-template-columns: repeat(4, minmax(0, 1fr))">
      <button class="opt">Popular</button>
      <button class="opt">Offers</button>
      <button class="opt">Beer</button>
      <button class="opt">Soft</button>
      <button class="opt">Wine</button>
      <button class="opt on" aria-selected="true">Whisky</button>
      <button class="opt">Gin</button>
      <button class="opt">More · 9</button>
    </div>

    <div class="items p" style="grid-template-columns: minmax(0, 1fr)">
      <div class="mrow"><b class="grow">Blended Scotch</b><button class="mbtn">Tot<small>8,000</small></button><button class="mbtn">Double<small>15,000</small></button><button class="mbtn">Bottle<small>180,000</small></button></div>
      <div class="mrow"><b class="grow">Blended Scotch 12</b><button class="mbtn">Tot<small>12,000</small></button><button class="mbtn">Double<small>22,000</small></button><button class="mbtn">Bottle<small>270,000</small></button></div>
      <div class="mrow"><b class="grow">Black blend</b><button class="mbtn">Tot<small>10,000</small></button><button class="mbtn">Double<small>18,000</small></button><button class="mbtn">Bottle<small>220,000</small></button></div>
      <div class="mrow"><b class="grow">Single malt 12</b><button class="mbtn">Tot<small>16,000</small></button><button class="mbtn">Double<small>30,000</small></button><button class="mbtn">Bottle<small>380,000</small></button></div>
      <div class="mrow"><b class="grow">Single malt 15</b><button class="mbtn">Tot<small>20,000</small></button><button class="mbtn">Double<small>38,000</small></button><button class="mbtn">Bottle<small>480,000</small></button></div>
    </div>
  </main>

  <footer class="foot">
    <a class="btn tonal" href="Order-Phone-Check.html" style="flex: 1 1 0">Order · 8</a>
    <button class="btn filled" style="flex: 2 1 0">Send 4 items</button>
  </footer>
</div>
</x-dc>
</body>
</html>
