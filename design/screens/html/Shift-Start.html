<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start my shift</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 1280px; height: 800px">
  <header class="bar tall">
    <a class="mark solo" href="#" aria-label="Nimbus POS, home"><i></i></a>
    <h1 class="t-h">Start of shift</h1>
    <span class="clock">Terminal 01 · Main hall</span>
    <span class="grow"></span>
    
    <span class="name"><b>Amina K.</b> · Waiter · Terminal 01</span>
    <button class="rb" aria-label="Lock the screen"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
  </header>
  <main class="page" style="align-items: center; justify-content: center"><section class="card vstack g16" style="width: 560px; padding: 24px">
      <div class="hstack"><span class="av" style="width: 56px; height: 56px; font-size: 17px">AK</span><div class="grow"><p class="t-sup muted">Good evening</p><h2 class="t-h">Amina K.</h2><p class="t-sup muted">Waiter · Tapas Downtown</p></div></div>
      <div class="hr"></div>
      <div class="hstack" style="justify-content: space-between; min-height: 40px"><span class="t-sup muted">Shift on the roster</span><span class="t-body b" style="text-align: right">17:00 to 23:00</span></div>
      <div class="hstack" style="justify-content: space-between; min-height: 40px"><span class="t-sup muted">Area</span><span class="t-body b" style="text-align: right">Main hall</span></div>
      <div class="hstack" style="justify-content: space-between; min-height: 40px"><span class="t-sup muted">Now</span><span class="t-body b" style="text-align: right">16:52, 8 minutes early</span></div>
      <p class="t-sup muted">You can look at the floor before you start. Taking orders needs a started shift.</p>
      <div class="vstack g8"><button class="btn filled" style="height: 56px; font-size: 17px">Start my shift</button><button class="btn textbtn">Only look for now</button></div>
    </section></main>
</div>
</x-dc>
</body>
</html>
