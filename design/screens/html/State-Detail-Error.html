<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order, error</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 1280px; height: 800px">
  <header class="bar">
    <a class="back" href="#"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>Floor</a>
    <h1 class="t-h">Table 12</h1>
    <span class="clock">3 guests · open 1 h 05 · Amina K.</span>
    <span class="grow"></span>
    <span class="search" style="width: 320px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search the whole menu</span>
    <span class="who" title="Signed in">AK</span>
  </header>
  <div class="ord" style="grid-template-columns: minmax(0, 1fr) 372px">
    <main class="menu"><div class="seg"><button style="min-width: 140px" class="on">Food</button><button style="min-width: 140px" class="">Drinks</button></div><div class="optgrid" style="grid-template-columns: repeat(8, minmax(0, 1fr))"><button class="opt on">Popular</button><button class="opt">Offers</button><button class="opt">Starters</button><button class="opt">Soups</button><button class="opt">Salads</button><button class="opt">Mains</button><button class="opt">Grills</button><button class="opt">Burgers</button><button class="opt">Pizza</button><button class="opt">Pasta</button><button class="opt">Local</button><button class="opt">Sides</button><button class="opt">Kids</button><button class="opt">Desserts</button><button class="opt">Breakfast</button><button class="opt">Extras</button></div><div inert class="items" style="grid-template-columns: repeat(4, minmax(0, 1fr))"><button class="item"><b>Beef burger</b><span>28,000</span></button><button class="item"><b>Chicken wings</b><span>24,000</span></button><button class="item"><b>Chips</b><span>8,000</span></button><button class="item"><b>Goat stew</b><span>26,000</span></button><button class="item"><b>Grilled tilapia</b><span>38,000</span></button><button class="item"><b>Chicken curry</b><span>27,000</span></button><button class="item"><b>Pork ribs</b><span>35,000</span></button><button class="item"><b>Beef samosas</b><span>12,000</span></button><button class="item"><b>Margherita pizza</b><span>30,000</span></button><button class="item"><b>Club sandwich</b><span>25,000</span></button><button class="item"><b>Greek salad</b><span>20,000</span></button><button class="item"><b>Fish and chips</b><span>32,000</span></button><button class="item"><b>Rolex</b><span>9,000</span></button><button class="item"><b>Matooke and beef</b><span>22,000</span></button><button class="item"><b>Chicken luwombo</b><span>30,000</span></button><button class="item"><b>Spring rolls</b><span>12,000</span></button></div></main>
    <aside class="check" aria-label="Order"><div class="hstack" style="padding: 16px 16px 8px"><h2 class="t-h">Order</h2></div><div class="vstack g12" style="padding: 32px 24px; align-items: center; text-align: center"><span class="bubble" style="width: 72px; height: 72px; background: var(--red-t); color: var(--red)"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/></svg></span><p class="t-row">Table 12’s order could not open</p><p class="t-sup muted">The 8 items sent at 19:42 and 20:15 are safe on the server. Do not take a new order for this table until it opens.</p><button class="btn filled" style="min-width: 200px">Try again</button></div><span class="grow"></span></aside>
  </div>
</div>
</x-dc>
</body>
</html>
