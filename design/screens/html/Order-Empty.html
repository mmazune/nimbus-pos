<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order screen, a free table just tapped</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 1280px; height: 800px">
  <header class="bar">
    <a class="back" href="Main.html"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>Floor</a>
    <h1 class="t-h">Table 4</h1>
    <span class="clock">Free · 2 seats</span>
    <span class="grow"></span>
    <span class="search" style="width: 320px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search the whole menu</span>
    <span class="who" title="Signed in">AK</span>
  </header>
  <div class="ord" style="grid-template-columns: minmax(0, 1fr) 372px">
    <main class="menu">
      <div class="hstack" style="justify-content: space-between">
        <div class="seg" role="tablist" aria-label="Menu">
          <button class="on" style="min-width: 140px">Food</button>
          <button class="" style="min-width: 140px">Drinks</button>
        </div>
      </div>
      <div class="optgrid" style="grid-template-columns: repeat(8, minmax(0, 1fr))"><button class="opt on">Popular</button><button class="opt">Offers</button><button class="opt">Starters</button><button class="opt">Soups</button><button class="opt">Salads</button><button class="opt">Mains</button><button class="opt">Grills</button><button class="opt">Burgers</button><button class="opt">Pizza</button><button class="opt">Pasta</button><button class="opt">Local</button><button class="opt">Sides</button><button class="opt">Kids</button><button class="opt">Desserts</button><button class="opt">Breakfast</button><button class="opt">Extras</button></div>
      <div class="items" style="grid-template-columns: repeat(4, minmax(0, 1fr))"><button class="item"><b>Beef burger</b><span>28,000</span></button><button class="item"><b>Chicken wings</b><span>24,000</span></button><button class="item"><b>Chips</b><span>8,000</span></button><button class="item"><b>Goat stew</b><span>26,000</span></button><button class="item"><b>Grilled tilapia</b><span>38,000</span></button><button class="item"><b>Chicken curry</b><span>27,000</span></button><button class="item"><b>Pork ribs</b><span>35,000</span></button><button class="item"><b>Beef samosas</b><span>12,000</span></button><button class="item"><b>Margherita pizza</b><span>30,000</span></button><button class="item"><b>Club sandwich</b><span>25,000</span></button><button class="item"><b>Greek salad</b><span>20,000</span></button><button class="item"><b>Fish and chips</b><span>32,000</span></button><button class="item"><b>Rolex</b><span>9,000</span></button><button class="item"><b>Matooke and beef</b><span>22,000</span></button><button class="item"><b>Chicken luwombo</b><span>30,000</span></button><button class="item"><b>Spring rolls</b><span>12,000</span></button><button class="item"><b>Pepper steak</b><span>45,000</span></button><button class="item"><b>Spaghetti bolognese</b><span>27,000</span></button><button class="item"><b>Fruit platter</b><span>15,000</span></button><button class="item"><b>Chocolate cake</b><span>14,000</span></button></div>
    </main>
    <aside class="check" aria-label="Order">
      <div class="hstack" style="padding: 16px 16px 8px; justify-content: space-between"><h2 class="t-h">Order</h2><span class="t-sup muted">No items</span></div>
      <div class="vstack" style="align-items: center; text-align: center; gap: 8px; padding: 72px 28px 0">
        <span class="bubble"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
        <p class="t-row" style="margin-top: 8px">Nothing on this table yet</p>
        <p class="t-sup muted">Tap an item to start. The table stays free until you send the order.</p>
      </div>
      <span class="grow"></span>
      <div class="hr"></div>
      <div class="tot" style="padding: 14px 16px 4px"><span class="t-row">Total</span><span class="t-h">UGX 0</span></div>
      <div class="hstack g8" style="padding: 12px 16px 16px"><button class="btn off" style="flex: 1 1 0; padding: 0 12px">Send</button></div>
    </aside>
  </div>
</div>
</x-dc>
</body>
</html>
