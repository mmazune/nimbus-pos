<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floor, small monitor, compact tiles</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 1024px; height: 768px">
  <header class="bar tall">
    <a class="mark solo" href="#" aria-label="Nimbus POS, home"><i></i></a>
    <h1 class="t-h">Floor</h1>
    <span class="clock">Main hall · 17 of 32 open · as at 19:42</span>
    <span class="grow"></span>
    <span class="search" style="width: 240px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Find a table or a tab</span>
    <span class="name"><b>Amina K.</b> · Waiter · Terminal 01</span>
    <button class="rb" aria-label="Lock the screen"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
  </header>

  <main class="page" style="padding: 16px 24px 16px">

    <div class="hstack" style="justify-content: space-between">
      <div class="hstack g8" role="tablist" aria-label="Areas">
        <button class="chip on" role="tab" aria-selected="true">Main hall <span class="n">32</span></button>
        <button class="chip" role="tab" aria-selected="false">Terrace <span class="n">16</span></button>
        <button class="chip" role="tab" aria-selected="false">Bar <span class="n">10</span></button>
        <button class="chip" role="tab" aria-selected="false">VIP <span class="n">6</span></button>
        <button class="chip" role="tab" aria-selected="false">Tabs <span class="n">6</span></button>
      </div>
      <div class="hstack">
        <div class="seg" role="tablist" aria-label="Whose tables">
          <button role="tab" aria-selected="false">My tables · 6</button>
          <button class="on" role="tab" aria-selected="true">All tables</button>
        </div>
        <button class="btn tonal"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New tab</button>
      </div>
    </div>

    <div class="floor c" style="grid-template-columns: repeat(7, minmax(0, 1fr))">
      <button class="tbl free"><span class="top"><span class="no">1</span><span class="pill p-green">Free</span></span><span class="bot"><span class="muted">4 seats</span></span></button>
      <button class="tbl"><span class="top"><span class="no">2</span><span class="pill p-brand">Open</span></span><span class="bot"><span class="who">You</span><span class="muted">42 min</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">3</span><span class="pill p-neutral">Open</span></span><span class="bot"><span class="who">Brian O.</span><span class="muted">18 min</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">4</span><span class="pill p-green">Free</span></span><span class="bot"><span class="muted">2 seats</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">5</span><span class="pill p-amber">Bill</span></span><span class="bot"><span class="who">Grace N.</span><span class="muted">1 h 20</span></span></button>
      <button class="tbl"><span class="top"><span class="no">6</span><span class="pill p-red">Late</span></span><span class="bot"><span class="who">You</span><span class="muted">26 min</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">7</span><span class="pill p-neutral">Reserved</span></span><span class="bot"><span class="muted">20:00 · 6 guests</span></span></button>

      <button class="tbl free"><span class="top"><span class="no">8</span><span class="pill p-green">Free</span></span><span class="bot"><span class="muted">4 seats</span></span></button>
      <button class="tbl"><span class="top"><span class="no">9</span><span class="pill p-brand">Open</span></span><span class="bot"><span class="who">You</span><span class="muted">9 min</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">10</span><span class="pill p-neutral">Open</span></span><span class="bot"><span class="who">David S.</span><span class="muted">51 min</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">11</span><span class="pill p-green">Free</span></span><span class="bot"><span class="muted">4 seats</span></span></button>
      <button class="tbl"><span class="top"><span class="no">12</span><span class="pill p-amber">Bill</span></span><span class="bot"><span class="who">You</span><span class="muted">1 h 05</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">13</span><span class="pill p-neutral">Open</span></span><span class="bot"><span class="who">Grace N.</span><span class="muted">33 min</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">14</span><span class="pill p-green">Free</span></span><span class="bot"><span class="muted">6 seats</span></span></button>

      <button class="tbl free"><span class="top"><span class="no">15</span><span class="pill p-neutral">Cleaning</span></span><span class="bot"><span class="muted">4 seats</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">16</span><span class="pill p-neutral">Open</span></span><span class="bot"><span class="who">Brian O.</span><span class="muted">27 min</span></span></button>
      <button class="tbl"><span class="top"><span class="no">17</span><span class="pill p-brand">Open</span></span><span class="bot"><span class="who">You</span><span class="muted">14 min</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">18</span><span class="pill p-green">Free</span></span><span class="bot"><span class="muted">4 seats</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">19</span><span class="pill p-red">Late</span></span><span class="bot"><span class="who">David S.</span><span class="muted">31 min</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">20</span><span class="pill p-neutral">Open</span></span><span class="bot"><span class="who">Grace N.</span><span class="muted">40 min</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">21</span><span class="pill p-neutral">Reserved</span></span><span class="bot"><span class="muted">20:30 · 4 guests</span></span></button>

      <button class="tbl free"><span class="top"><span class="no">22</span><span class="pill p-green">Free</span></span><span class="bot"><span class="muted">2 seats</span></span></button>
      <button class="tbl"><span class="top"><span class="no">23</span><span class="pill p-amber">Not sent</span></span><span class="bot"><span class="who">You</span><span class="muted">3 items</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">24</span><span class="pill p-neutral">Open</span></span><span class="bot"><span class="who">Brian O.</span><span class="muted">22 min</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">25</span><span class="pill p-green">Free</span></span><span class="bot"><span class="muted">4 seats</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">26</span><span class="pill p-neutral">Open</span></span><span class="bot"><span class="who">David S.</span><span class="muted">12 min</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">27</span><span class="pill p-green">Free</span></span><span class="bot"><span class="muted">8 seats</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">28</span><span class="pill p-amber">Bill</span></span><span class="bot"><span class="who">Grace N.</span><span class="muted">1 h 34</span></span></button>

      <button class="tbl free"><span class="top"><span class="no">29</span><span class="pill p-green">Free</span></span><span class="bot"><span class="muted">4 seats</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">30</span><span class="pill p-neutral">Open</span></span><span class="bot"><span class="who">Brian O.</span><span class="muted">48 min</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">31</span><span class="pill p-green">Free</span></span><span class="bot"><span class="muted">2 seats</span></span></button>
      <button class="tbl free"><span class="top"><span class="no">32</span><span class="pill p-green">Free</span></span><span class="bot"><span class="muted">4 seats</span></span></button>
    </div>
  </main>

  <nav class="navbar" aria-label="Main">
    <a class="on" aria-current="page" href="#"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Floor</a>
    <a href="#"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>Reservations</a>
    <a href="#"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M5 18a7 7 0 0 1 14 0M12 9V6M10 6h4"/></svg>Ready<span class="nb">2</span></a>
    <a href="#"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</a>
  </nav>
</div>
</x-dc>
</body>
</html>
