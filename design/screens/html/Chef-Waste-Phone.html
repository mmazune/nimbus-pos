<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chef on a phone, take out of stock</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 390px; height: 844px">
  <header class="band"><div class="hstack"><a class="rb" href="#" aria-label="Back"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a><div class="grow"><h1 class="t-h">Take out of stock</h1><p class="t-sup" style="color: var(--on-primary-muted)">Kitchen store</p></div></div></header>
  <main class="body" style="gap: 14px">
    <div><label class="lab">What</label><div class="field"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Beef mince</div><p class="t-small muted" style="margin-top: 4px">6.2 kg in the kitchen now</p></div>
    <div class="hstack" style="justify-content: space-between"><span class="t-body b">How much</span><div class="step" style="justify-content: flex-end"><button class="round sm tonal" aria-label="Less"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><b style="min-width: 72px">1.5 kg</b><button class="round sm tonal" aria-label="More"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
    <div><p class="lab">Why</p><div class="optgrid" style="grid-template-columns: 1fr 1fr"><button class="opt on">Spoiled or expired</button><button class="opt">Burnt or dropped</button><button class="opt">Broken</button><button class="opt">Staff meal</button><button class="opt">Missing</button><button class="opt">Back to supplier</button></div></div>
    <div><label class="lab">Note</label><div class="field ph">Fridge 2 was off overnight</div></div>
    <div class="card" style="padding: 8px 16px"><div class="hstack" style="justify-content: space-between; min-height: 40px"><span class="t-sup muted">Worth</span><span class="t-body b" style="text-align: right">UGX 27,000</span></div><div class="hstack" style="justify-content: space-between; min-height: 40px"><span class="t-sup muted">Left in the kitchen</span><span class="t-body b" style="text-align: right">4.7 kg · 31 burgers</span></div></div>
    <p class="t-small muted">Saved with your name and the time. Above UGX 50,000 a supervisor types a PIN. “Missing” tells the manager at once.</p>
  </main>
  <footer class="foot"><button class="btn filled grow">Take out 1.5 kg</button></footer>
</div>
</x-dc>
</body>
</html>
