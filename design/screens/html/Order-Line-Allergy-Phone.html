<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order, line options, phone</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 390px; height: 844px">
  <header inert class="band" style="padding-bottom: 16px">
    <div class="hstack">
      <a class="rb" href="#" aria-label="Back"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
      <div class="grow"><h1 class="t-h">Table 12</h1><p class="t-sup" style="color: var(--on-primary-muted)">3 guests · open 1 h 05</p></div>
      <button class="rb" aria-label="Table actions"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </div>
  </header><main class="body" inert><div class="card" style="overflow: hidden"><p class="cap" style="padding: 8px 16px 4px">Not sent</p><button class="line " style="width: 100%"><span class="q">1</span><span class="grow"><span class="nm">Beef burger</span><br><span class="sub">Medium · Nut allergy · Takeaway</span></span><span class="pr">28,000</span></button></div></main>  <div class="scrim"></div>  <section class="sheet " aria-label="Beef burger" style="gap: 16px">
    <span class="grab"></span>
    <div class="hstack"><div class="grow"><h2 class="t-h">Beef burger</h2><p class="t-sup muted">Not sent yet · UGX 28,000</p></div><a class="close" href="#" aria-label="Close"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a></div>
    
    <div class="vstack g12"><div><p class="lab">How many</p><div class="step"><button class="round sm tonal" aria-label="One fewer"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><b>1</b><button class="round sm tonal" aria-label="One more"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></div><div class="grow" style="width: 100%"><p class="lab">How cooked</p><div class="seg fill"><button class="">Rare</button><button class="on">Medium</button><button class="">Well done</button></div></div></div>
    <div><p class="lab">Allergy</p><div class="optgrid" style="grid-template-columns: repeat(3, minmax(0, 1fr))"><button class="opt on">Nuts</button><button class="opt">Gluten</button><button class="opt">Dairy</button><button class="opt">Eggs</button><button class="opt">Shellfish</button><button class="opt">Other</button></div></div>
    <div><p class="lab" style="display: none"></p><div class="seg fill"><button class="">Here</button><button class="on">Takeaway</button></div></div>
    <div><label class="lab">Note for the kitchen</label><div class="field">No sauce on the bun</div></div>
    <div class="hstack g8"><span class="pill p-red">NUT ALLERGY</span><span class="pill p-neutral">TAKEAWAY</span><span class="t-sup muted grow">On the ticket, in red</span></div>
    <div class="hstack" style="justify-content: stretch"><button class="btn textbtn danger">Remove</button><span class="grow"></span><button class="btn filled" style="min-width: 220px">Save the line</button></div>
  </section>
</div>
</x-dc>
</body>
</html>
