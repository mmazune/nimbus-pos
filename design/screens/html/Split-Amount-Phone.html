<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split the bill, phone</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 390px; height: 844px">
  <header inert class="band" style="padding-bottom: 16px">
    <div class="hstack">
      <a class="rb" href="#" aria-label="Back"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
      <div class="grow"><h1 class="t-h">Table 12</h1><p class="t-sup" style="color: var(--on-primary-muted)">3 guests · open 1 h 05</p></div>
      <button class="rb" aria-label="Table actions"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </div>
  </header>
  <main class="body" inert style="gap: 0; padding: 0">
    <div class="check" style="flex: 1 1 0; box-shadow: none"><p class="cap" style="padding: 8px 16px 4px">Sent 20:15</p><button class="line sent"><span class="q">2</span><span class="grow"><span class="nm">Lager 500 ml</span></span><span class="pr">12,000</span></button><button class="line sent"><span class="q">1</span><span class="grow"><span class="nm">Blended Scotch</span><br><span class="sub">Double · Cola</span></span><span class="pr">15,000</span></button><button class="line sent"><span class="q">1</span><span class="grow"><span class="nm">Cola 300 ml</span></span><span class="pr">3,000</span></button><div class="hr" style="margin: 8px 16px"></div><p class="cap" style="padding: 8px 16px 4px">Sent 19:42</p><button class="line sent"><span class="q">1</span><span class="grow"><span class="nm">Beef burger</span><br><span class="sub">Medium · No onions</span></span><span class="pr">28,000</span></button><button class="line sent"><span class="q">2</span><span class="grow"><span class="nm">Chips</span></span><span class="pr">16,000</span></button><button class="line sent"><span class="q">1</span><span class="grow"><span class="nm">Chicken wings</span></span><span class="pr">24,000</span></button></div>
  </main>
  <footer class="foot" inert><button class="btn tonal" style="flex: 1 1 0">Bill · UGX 98,000</button></footer>  <div class="scrim"></div>  <section class="sheet " aria-label="Split the bill" style="gap: 14px">
    <span class="grab"></span>
    <div class="hstack"><div class="grow"><h2 class="t-h">Split the bill</h2><p class="t-sup muted">Table 12 · UGX 98,000 · 8 items</p></div><a class="close" href="#" aria-label="Close"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a></div>
    <div class="seg fill"><button class="">Guest</button><button class="">Item</button><button class="on">Amount</button><button class="">Evenly</button></div><div class="field" style="height: 64px; justify-content: flex-end; font-size: 26px; line-height: 32px; font-weight: 700">50,000</div><div class="optgrid" style="grid-template-columns: repeat(3, minmax(0, 1fr))"><button class="key" style="height: 52px">1</button><button class="key" style="height: 52px">2</button><button class="key" style="height: 52px">3</button><button class="key" style="height: 52px">4</button><button class="key" style="height: 52px">5</button><button class="key" style="height: 52px">6</button><button class="key" style="height: 52px">7</button><button class="key" style="height: 52px">8</button><button class="key" style="height: 52px">9</button><button class="key" style="height: 52px">000</button><button class="key" style="height: 52px">0</button><button class="key" style="height: 52px" aria-label="Delete"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 6H9l-6 6 6 6h12z"/><path d="m12 9 6 6M18 9l-6 6"/></svg></button></div><div class="hstack" style="justify-content: space-between; min-height: 40px"><span class="t-sup muted">Left on table 12</span><span class="t-body b" style="text-align: right">UGX 48,000</span></div>
    <button class="btn filled">Make 2 bills</button>
  </section>
</div>
</x-dc>
</body>
</html>
