<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Order, a line became sold out</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 1280px; height: 800px">
  <header class="bar">
    <a class="back" href="#"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>Floor</a>
    <h1 class="t-h">Table 23</h1>
    <span class="clock">2 guests · open 6 min · Amina K.</span>
    <span class="grow"></span>
    <span class="search" style="width: 320px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search the whole menu</span>
    <span class="who" title="Signed in">AK</span>
  </header>
  <div class="ord" style="grid-template-columns: minmax(0, 1fr) 372px">
    <main class="menu"><div class="seg"><button style="min-width: 140px" class="on">Food</button><button style="min-width: 140px" class="">Drinks</button></div><div class="optgrid" style="grid-template-columns: repeat(8, minmax(0, 1fr))"><button class="opt">Popular</button><button class="opt">Offers</button><button class="opt">Starters</button><button class="opt">Soups</button><button class="opt">Salads</button><button class="opt">Mains</button><button class="opt on">Grills</button><button class="opt">Burgers</button><button class="opt">Pizza</button><button class="opt">Pasta</button><button class="opt">Local</button><button class="opt">Sides</button><button class="opt">Kids</button><button class="opt">Desserts</button><button class="opt">Breakfast</button><button class="opt">Extras</button></div><div class="items" style="grid-template-columns: repeat(4, minmax(0, 1fr))"><button class="item "><b>Pork ribs</b><span>35,000</span></button><button class="item "><b>Pepper steak</b><span>45,000 · 3 left</span></button><button class="item off"><b>Lamb chops</b><span>Sold out since 19:40</span></button><button class="item "><b>Grilled tilapia</b><span>38,000</span></button><button class="item "><b>T-bone steak</b><span>52,000</span></button><button class="item "><b>Beef skewers</b><span>18,000</span></button><button class="item "><b>Grilled chicken</b><span>25,000</span></button><button class="item "><b>Pork chops</b><span>30,000</span></button></div></main>
    <aside class="check" aria-label="Order">
      <div class="hstack" style="padding: 16px 16px 8px; justify-content: space-between"><h2 class="t-h">Order</h2><span class="t-sup muted">3 items</span></div>
      <p class="cap" style="padding: 8px 16px 4px">Not sent</p><div class="line" style="background: var(--red-t)"><span class="q" style="background: var(--card); color: var(--red)">1</span><span class="grow"><span class="nm" style="color: var(--red)">Lamb chops</span><br><span class="sub" style="color: var(--red)">Sold out at 19:40, after you added it. It will not send and is not on the bill.</span></span><button class="btn sm textbtn danger" style="padding: 0 8px">Remove</button></div><button class="line " style="width: 100%"><span class="q">1</span><span class="grow"><span class="nm">Rolex</span></span><span class="pr">9,000</span></button><button class="line " style="width: 100%"><span class="q">1</span><span class="grow"><span class="nm">Chips</span></span><span class="pr">8,000</span></button><button class="line " style="width: 100%"><span class="q">1</span><span class="grow"><span class="nm">Water 500 ml</span></span><span class="pr">2,000</span></button>
      <span class="grow"></span>
      <div class="hr"></div>
      <div class="tot" style="padding: 14px 16px 4px"><span class="t-row">Total</span><span class="t-h">UGX 19,000</span></div>
      <div class="hstack g8" style="padding: 12px 16px 16px"><button class="sq tonal" aria-label="Table actions"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button><button class="btn tonal" style="flex: 1 1 0; padding: 0 12px">Ask the kitchen</button><button class="btn filled" style="flex: 1.2 1 0; padding: 0 12px">Send 3 items</button></div>
    </aside>
  </div>
</div>
</x-dc>
</body>
</html>
