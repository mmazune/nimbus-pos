<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floor, Tabs area</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 1280px; height: 800px">
  <header class="bar tall">
    <a class="mark solo" href="#" aria-label="Nimbus POS, home"><i></i></a>
    <h1 class="t-h">Floor</h1>
    <span class="clock">Tabs · 6 open · as at 21:05</span>
    <span class="grow"></span>
    <span class="search"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Find a table or a tab</span>
    <span class="name"><b>Amina K.</b> · Waiter · Terminal 01</span>
    <button class="rb" aria-label="Lock the screen"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
  </header>
  <main class="page" style="padding: 16px 32px 16px">
    <div class="hstack" style="justify-content: space-between"><div class="hstack g8" role="tablist" aria-label="Areas"><button class="chip" role="tab">Main hall <span class="n">32</span></button><button class="chip" role="tab">Terrace <span class="n">16</span></button><button class="chip" role="tab">Bar <span class="n">10</span></button><button class="chip" role="tab">VIP <span class="n">6</span></button><button class="chip on" role="tab">Tabs <span class="n">6</span></button></div><div class="hstack"><div class="seg"><button class="">My tabs · 3</button><button class="on">All tabs</button></div><button class="btn filled"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New tab</button></div></div>
    <div class="floor" style="grid-template-columns: repeat(6, minmax(0, 1fr))">
      <button class="tbl "><span class="top"><span class="no">Tab 1</span><span class="pill p-brand">Open</span></span><span class="mid">Red cap at the bar</span><span class="bot"><span class="who">You</span><span class="amt">46,000</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">Tab 2</span><span class="pill p-neutral">Open</span></span><span class="mid">Two at the window</span><span class="bot"><span class="who">Brian O.</span><span class="amt">31,000</span></span></button>
      <button class="tbl "><span class="top"><span class="no">Tab 3</span><span class="pill p-amber">Bill</span></span><span class="mid">Birthday group</span><span class="bot"><span class="who">You</span><span class="amt">128,000</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">Tab 4</span><span class="pill p-neutral">Open</span></span><span class="mid">Blue shirt, standing</span><span class="bot"><span class="who">David S.</span><span class="amt">18,000</span></span></button>
      <button class="tbl other"><span class="top"><span class="no">Tab 5</span><span class="pill p-neutral">Open</span></span><span class="mid">Darts board</span><span class="bot"><span class="who">Grace N.</span><span class="amt">62,000</span></span></button>
      <button class="tbl "><span class="top"><span class="no">Tab 6</span><span class="pill p-red">Late</span></span><span class="mid">Office party, 8</span><span class="bot"><span class="who">You</span><span class="amt">211,500</span></span></button>
    </div>
    <p class="t-sup muted">A tab is for guests with no table. Each gets the next free number and a note to find them.</p>
  </main>
  <nav class="navbar" aria-label="Main">
    <a class="on" aria-current="page" href="#"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Floor</a>
    <a href="#"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>Reservations</a>
    <a href="#"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M5 18a7 7 0 0 1 14 0M12 9V6M10 6h4"/></svg>Ready<span class="nb">2</span></a>
    <a href="#"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</a>
  </nav>
</div>
</x-dc>
</body>
</html>
