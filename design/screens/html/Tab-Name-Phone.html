<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Name a tab, phone</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 390px; height: 844px">
  <header class="band" inert>
    <div class="hstack"><h1 class="t-title grow">Floor</h1><button class="rb" aria-label="Find a tab"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button><button class="rb" aria-label="New tab"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <p class="sub">Tabs · 6 open · as at 21:05</p>
  </header>
  <main class="body" inert>
    <div class="sw"><button class="round sm" aria-label="Previous area"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><button class="mid"><span class="t-row">Tabs</span> <span class="t-sup muted">· 6 open</span></button><button class="round sm" aria-label="Next area"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button></div>
    <div class="card" style="overflow: hidden"><button class="row" style="width: 100%"><span class="grow"><span class="t-body b">Tab 1 · Red cap at the bar</span><br><span class="t-sup muted">You · UGX 46,000</span></span><span class="pill p-brand">Open</span></button><button class="row" style="width: 100%"><span class="grow"><span class="t-body b">Tab 2 · Two at the window</span><br><span class="t-sup muted">Brian O. · UGX 31,000</span></span><span class="pill p-neutral">Open</span></button><button class="row" style="width: 100%"><span class="grow"><span class="t-body b">Tab 3 · Birthday group</span><br><span class="t-sup muted">You · UGX 128,000</span></span><span class="pill p-amber">Bill</span></button><button class="row" style="width: 100%"><span class="grow"><span class="t-body b">Tab 4 · Blue shirt, standing</span><br><span class="t-sup muted">David S. · UGX 18,000</span></span><span class="pill p-neutral">Open</span></button><button class="row" style="width: 100%"><span class="grow"><span class="t-body b">Tab 5 · Darts board</span><br><span class="t-sup muted">Grace N. · UGX 62,000</span></span><span class="pill p-neutral">Open</span></button><button class="row" style="width: 100%"><span class="grow"><span class="t-body b">Tab 6 · Office party, 8</span><br><span class="t-sup muted">You · UGX 211,500</span></span><span class="pill p-red">Late</span></button></div>
    <button class="btn filled"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New tab</button>
  </main>
  <nav inert class="tabbar" aria-label="Main">
    <a class="on" aria-current="page" href="#"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Floor</a>
    <a href="#"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>Reservations</a>
    <a href="#"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M5 18a7 7 0 0 1 14 0M12 9V6M10 6h4"/></svg>Ready<span class="nb">2</span></a>
    <a href="#"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</a>
  </nav>  <div class="scrim"></div>  <section class="sheet " aria-label="New tab · Tab 7" style="gap: 16px">
    <span class="grab"></span>
    <div class="hstack"><div class="grow"><h2 class="t-h">New tab · Tab 7</h2><p class="t-sup muted">Numbered by itself. A note helps anyone find them.</p></div><a class="close" href="#" aria-label="Close"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a></div>
    
    <div><label class="lab">Note</label><div class="field">Green dress, by the pillar</div></div>
    <div class="optgrid" style="grid-template-columns: repeat(2, minmax(0, 1fr))"><button class="opt">At the bar</button><button class="opt">Standing</button><button class="opt">By the door</button><button class="opt">Darts board</button></div>
    <div class="hstack"><p class="lab grow" style="margin: 0">Guests</p><div class="step"><button class="round sm tonal" aria-label="One fewer"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><b>2</b><button class="round sm tonal" aria-label="One more"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
    <button class="btn filled">Open Tab 7</button>
  </section>
</div>
</x-dc>
</body>
</html>
