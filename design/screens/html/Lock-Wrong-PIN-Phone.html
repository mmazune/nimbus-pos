<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type your PIN</title>
<link rel="stylesheet" href="../kit.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ab" style="width: 390px; height: 844px">
  <header class="band">
    <div class="hstack"><h1 class="t-title grow">Tapas Downtown</h1></div>
    <p class="sub">Terminal 01 · 19:58</p>
  </header>
  <main class="body" style="gap: 16px; justify-content: flex-end; padding-bottom: 24px">
    <h2 class="t-h" style="text-align: center">Type your PIN</h2>
    <div class="pin bad" aria-label="4 of 4 digits"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
    <p class="t-sup" style="text-align: center; color: var(--red); min-height: 20px">That PIN is not right. 2 tries left, then a 5-minute wait.</p>
    <div class="optgrid" style="grid-template-columns: repeat(3, minmax(0, 1fr))"><button class="key" style="height: 72px">1</button><button class="key" style="height: 72px">2</button><button class="key" style="height: 72px">3</button><button class="key" style="height: 72px">4</button><button class="key" style="height: 72px">5</button><button class="key" style="height: 72px">6</button><button class="key" style="height: 72px">7</button><button class="key" style="height: 72px">8</button><button class="key" style="height: 72px">9</button><button class="key" aria-label="Clear" style="height: 72px; font-size: 17px">Clear</button><button class="key" style="height: 72px">0</button><button class="key" style="height: 72px" aria-label="Delete"><svg class="ic l" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg></button></div>
    <button class="btn textbtn" style="align-self: center">Forgot your PIN?</button>
  </main>
</div>
</x-dc>
</body>
</html>
